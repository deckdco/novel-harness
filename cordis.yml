# novel-harness 本机加载配置（《存道》实例）
# 启动：cd ***/novel-harness && npx @deepseek-ai/dsh web --patch ./cordis.yml
- insert:
    - id: novel-harness
      name: '/path/to/novel-harness/src/index.ts'
      config:
        root: '/path/to/齐国大航海/v2'
        files:
          bible: '../v1/00_设定圣经.md'
          master: '存道-四部总成稿.md'
          outline: '存道-千章卷纲.md'
          methodology: '存道-网文写作方法论.md'
          bridges: '存道-亮点桥段设计.md'
        chaptersDir: '正文'
        primaryVariant: 'cc 版'
        variants: ['cc 版', 'ds 版', 'gemini 版']
        nearChapters: 5
        coachMode: false
        anachronismLexicon: []
        anachronismWhitelist: []
